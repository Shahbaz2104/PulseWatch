# Fly.io deployment for the read-only public demo.
# `fly launch --no-deploy` will offer to rename the app; keep the volume name
# in sync with [[mounts]].source. Deploys are manual: `fly deploy`.
app = "pulsewatch-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DEMO_MODE = "true"
  STATIC_DIR = "/app/static"
  DATABASE_URL = "sqlite:////data/pulsewatch.db"
  HOST = "0.0.0.0"
  PORT = "8080"
  RUST_LOG = "info,pulsewatch_backend=info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "pulsewatch_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
